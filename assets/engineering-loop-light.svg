<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Shawky Elsayed engineering delivery loop</title>
  <desc id="desc">A safe, non-overlapping flow from understanding through design, build, and measurable improvement.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset=".5" stop-color="#7C3AED"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94A3B8" stroke-width="1" opacity=".10"/></pattern>
    <style>.sans{font-family:Inter,Segoe UI,Arial,sans-serif}.dash{animation:dash 10s linear infinite}@keyframes dash{to{stroke-dashoffset:-240}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  </defs>
  <rect width="1200" height="300" rx="26" fill="#F8FAFC"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="25" fill="none" stroke="#CBD5E1"/>
  <text class="sans" x="48" y="48" fill="#0F172A" font-size="20" font-weight="800">HOW I TURN AMBIGUITY INTO DELIVERY</text>
  <text class="sans" x="48" y="75" fill="#64748B" font-size="14">Understand the real problem, design safe boundaries, build reliably, then improve from evidence.</text>
  <path d="M112 132H1088" fill="none" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <path d="M112 132H1088" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 22" class="dash"/>
  <circle r="8" fill="#2563EB" filter="url(#glow)"><animateMotion dur="7.5s" repeatCount="indefinite" path="M112 132H1088"/></circle>
  <g class="sans">
    <path d="M157 132V160" stroke="#2563EB" stroke-width="2"/>
    <g transform="translate(40 160)"><rect width="235" height="106" rx="18" fill="#FFFFFF" stroke="#2563EB"/><circle cx="28" cy="28" r="11" fill="#2563EB"/><text x="28" y="33" fill="#FFF" text-anchor="middle" font-size="12" font-weight="800">1</text><text x="50" y="33" fill="#0F172A" font-size="16" font-weight="800">UNDERSTAND</text><text x="22" y="63" fill="#64748B" font-size="13">Users, constraints, risks,</text><text x="22" y="83" fill="#64748B" font-size="13">and the real success signal.</text></g>
    <path d="M452 132V160" stroke="#7C3AED" stroke-width="2"/>
    <g transform="translate(335 160)"><rect width="235" height="106" rx="18" fill="#FFFFFF" stroke="#7C3AED"/><circle cx="28" cy="28" r="11" fill="#7C3AED"/><text x="28" y="33" fill="#FFF" text-anchor="middle" font-size="12" font-weight="800">2</text><text x="50" y="33" fill="#0F172A" font-size="16" font-weight="800">DESIGN</text><text x="22" y="63" fill="#64748B" font-size="13">Boundaries, contracts, data,</text><text x="22" y="83" fill="#64748B" font-size="13">and failure-aware flows.</text></g>
    <path d="M747 132V160" stroke="#0891B2" stroke-width="2"/>
    <g transform="translate(630 160)"><rect width="235" height="106" rx="18" fill="#FFFFFF" stroke="#0891B2"/><circle cx="28" cy="28" r="11" fill="#0891B2"/><text x="28" y="33" fill="#FFF" text-anchor="middle" font-size="12" font-weight="800">3</text><text x="50" y="33" fill="#0F172A" font-size="16" font-weight="800">BUILD</text><text x="22" y="63" fill="#64748B" font-size="13">Accessible UI, robust APIs,</text><text x="22" y="83" fill="#64748B" font-size="13">tests, and observability.</text></g>
    <path d="M1042 132V160" stroke="#E11D48" stroke-width="2"/>
    <g transform="translate(925 160)"><rect width="235" height="106" rx="18" fill="#FFFFFF" stroke="#E11D48"/><circle cx="28" cy="28" r="11" fill="#E11D48"/><text x="28" y="33" fill="#FFF" text-anchor="middle" font-size="12" font-weight="800">4</text><text x="50" y="33" fill="#0F172A" font-size="16" font-weight="800">IMPROVE</text><text x="22" y="63" fill="#64748B" font-size="13">Release, measure, learn,</text><text x="22" y="83" fill="#64748B" font-size="13">and sharpen the system.</text></g>
  </g>
</svg>