name: Recover facade images

on:
  push:
    paths:
      - '.github/workflows/recover-facade-images.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download originals into design folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf facade-images facade-images.zip
          mkdir -p facade-images
          views=(hero-main opposite-corner street-arrival entrance-closeup fence-gate-closeup balcony-detail hero-dusk original-reference)
          for design in 1 2 3 4 5; do
            folder="facade-images/design-0${design}"
            mkdir -p "$folder"
            for view in "${views[@]}"; do
              file="design-0${design}-${view}.png"
              url="https://facade-approval.vercel.app/designs/${design}/${file}"
              status=$(curl -L --silent --show-error --output "$folder/$file" --write-out '%{http_code}' "$url")
              if [ "$status" != "200" ]; then
                echo "Missing or failed: $url ($status)"
                rm -f "$folder/$file"
              fi
            done
          done
          find facade-images -type f -print
          zip -0 -r facade-images.zip facade-images

      - name: Upload ZIP artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: facade-images
          path: facade-images.zip
          if-no-files-found: error
          compression-level: 0

      - name: Record artifact details
        shell: bash
        run: |
          cat > facade-artifact-info.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "artifact_id": "${{ steps.upload.outputs.artifact-id }}",
            "artifact_url": "${{ steps.upload.outputs.artifact-url }}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facade-artifact-info.json
          git commit -m "Record facade artifact ID" || exit 0
          git push

# Trigger direct recovery and artifact handoff
